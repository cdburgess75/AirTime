sentence=Platform-independent core for AirTime: multi-source over-the-air time arbitration.
paragraph=RDS group 4A clock-time decode and multi-station voting, Goertzel WWV tone detection and minute-marker gating, a slew-disciplined clock with crystal drift learning, an NTP/SNTP server packet layer, and the acquisition/listen scheduler. No Arduino or ESP-IDF dependencies; unit-tested on the host. Headers live under an airtime/ prefix to avoid collisions with platform headers such as lwIP's sntp.h.
