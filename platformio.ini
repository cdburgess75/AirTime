; AirTime — PlatformIO configuration
;
; The platform-independent core (lib/airtime_core) is developed and unit-tested
; on the host. Today the canonical test command is `make test` (plain g++, no
; network). This file scaffolds the PlatformIO envs:
;
;   * [env:native]  — run the same host tests via PlatformIO once installed.
;
; There is NO device environment here, and there will not be one. Upstream
; esp32-si4732/ats-mini (vendored at firmware/ats-mini/) is an Arduino sketch
; built with Arduino CLI via ats-mini/sketch.yaml — it has no platformio.ini.
; PLAN.md §6's "Build: PlatformIO" was mistaken about that project.
;
; Device builds therefore run from firmware/ats-mini/ with arduino-cli; see
; docs/MILESTONE0.md §5. This file governs the host build only.

[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=c++17 -I lib/airtime_core/src

; --- Device environment (placeholder — enable in Milestone 1) --------------
; [env:ats-mini]
; platform = espressif32
; board = esp32-s3-devkitc-1        ; ESP32-S3-WROOM-1-N16R8; confirm PSRAM (OSPI vs QSPI) per §6
; framework = arduino
; monitor_speed = 115200
; build_flags = -std=gnu++17 -DBOARD_HAS_PSRAM
