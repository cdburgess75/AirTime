; AirTime — PlatformIO configuration
;
; The platform-independent core (lib/airtime_core) is developed and unit-tested
; on the host. Today the canonical test command is `make test` (plain g++, no
; network). This file scaffolds the PlatformIO envs:
;
;   * [env:native]  — run the same host tests via PlatformIO once installed.
;   * the device env — added in Milestone 1, targeting the ESP32-S3 ATS Mini and
;     built on top of a fork of esp32-si4732/ats-mini. It will pull in
;     lib/airtime_core unchanged. It is intentionally NOT defined yet: no
;     firmware is flashed until Milestone 0 hardware verification is complete
;     (see docs/PLAN.md §7).

[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=c++17 -I lib/airtime_core

